        // ==================== UTILITY FUNCTIONS ====================
        function formatDate(date) {
            const days = ['MINGGU', 'SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
            const months = ['JANUARI', 'FEBRUARI', 'MARET', 'APRIL', 'MEI', 'JUNI', 'JULI', 'AGUSTUS', 'SEPTEMBER', 'OKTOBER', 'NOVEMBER', 'DESEMBER'];
            const d = new Date(date);
            return `${days[d.getDay()]}, ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function formatTime(date) {
            const d = new Date(date);
            return d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + ' WIB';
        }

        function formatDateShort(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return `${d.getDate()}/${d.getMonth() + 1}/${d.getFullYear()}`;
        }

        function formatDateTimeShort(dateStr) {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            if (isNaN(d.getTime())) return '-';

            // PAKSA WIB (ASIA/JAKARTA) AGAR KONSISTEN DI SEMUA DEVICE
            try {
                const parts = new Intl.DateTimeFormat('id-ID', {
                    timeZone: 'Asia/Jakarta',
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    hour12: false
                }).formatToParts(d);

                const get = (type) => (parts.find(p => p.type === type) || {}).value || '';
                const dd = get('day');
                const mm = get('month');
                const yyyy = get('year');
                const hh = get('hour');
                const min = get('minute');
                return `${dd}/${mm}/${yyyy} - ${hh}:${min} WIB`;
            } catch (e) {
                const dd = String(d.getDate()).padStart(2, '0');
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const yyyy = d.getFullYear();
                const hh = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                return `${dd}/${mm}/${yyyy} - ${hh}:${min} WIB`;
            }
        }

        function calculateEndDate(startDate, duration) {
            if (!startDate || !duration) return '';
            const start = new Date(startDate);
            const days = parseInt(duration);
            if (days === 1) return startDate;
            start.setDate(start.getDate() + days - 1);
            return start.toISOString().split('T')[0];
        }

        function calculateDuration(start, end) {
            if (!start || !end) return 0;
            const s = new Date(start);
            const e = new Date(end);
            return Math.ceil((e - s) / (1000 * 60 * 60 * 24)) + 1;
        }

        // ===== HITUNG CUTI TANPA SABTU/MINGGU (HARI KERJA) =====
        function isWeekendDateObj(d) {
            const day = d.getDay();
            return day === 0 || day === 6; // MINGGU(0) / SABTU(6)
        }

        function parseDateOnly(dateStr) {
            const s = String(dateStr || '').substring(0, 10);
            const parts = s.split('-');
            if (parts.length !== 3) return null;
            const y = parseInt(parts[0]);
            const m = parseInt(parts[1]);
            const d = parseInt(parts[2]);
            if ([y, m, d].some(n => isNaN(n))) return null;
            return new Date(y, m - 1, d);
        }

        function formatDateOnly(d) {
            const yy = d.getFullYear();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;
        }

        // Jika tanggal jatuh di Sabtu/Minggu, geser ke hari kerja berikutnya
        function adjustToNextWeekday(dateStr) {
            const dt = parseDateOnly(dateStr);
            if (!dt) return '';
            if (!isWeekendDateObj(dt)) return formatDateOnly(dt);
            const moved = new Date(dt);
            while (isWeekendDateObj(moved)) moved.setDate(moved.getDate() + 1);
            return formatDateOnly(moved);
        }

        // Hitung tanggal selesai berdasarkan lama cuti (hari kerja), tanpa menghitung Sabtu/Minggu.
        // Durasi bersifat inklusif (hari pertama = tanggal mulai).
        function calculateEndDateWorkdays(startDateStr, duration) {
            if (!startDateStr || !duration) return '';
            const days = parseInt(duration);
            if (isNaN(days) || days < 1) return '';

            // Pastikan start adalah hari kerja
            let start = parseDateOnly(startDateStr);
            if (!start) return '';
            if (isWeekendDateObj(start)) {
                // Geser ke hari kerja berikutnya
                start = parseDateOnly(adjustToNextWeekday(startDateStr));
            }

            if (days === 1) return formatDateOnly(start);

            const dt = new Date(start);
            let added = 0;
            while (added < (days - 1)) {
                dt.setDate(dt.getDate() + 1);
                if (!isWeekendDateObj(dt)) added++;
            }
            return formatDateOnly(dt);
        }

        // Hitung durasi hari kerja dari start-end (inklusif) tanpa Sabtu/Minggu
        function calculateDurationWorkdays(startDateStr, endDateStr) {
            if (!startDateStr || !endDateStr) return 0;
            const start = parseDateOnly(startDateStr);
            const end = parseDateOnly(endDateStr);
            if (!start || !end) return 0;
            if (end < start) return 0;

            let count = 0;
            const dt = new Date(start);
            while (dt <= end) {
                if (!isWeekendDateObj(dt)) count++;
                dt.setDate(dt.getDate() + 1);
            }
            return count;
        }

        // Tambah hari untuk tanggal format yyyy-mm-dd (AMAN untuk WIB, tanpa geser timezone)

            if (!dateStr) return '';

            const parts = s.split('-');
            if (parts.length !== 3) return '';
            const y = parseInt(parts[0]);
            const m = parseInt(parts[1]);
            const d = parseInt(parts[2]);
            if ([y, m, d].some(n => isNaN(n))) return '';
            const dt = new Date(y, m - 1, d);
            dt.setDate(dt.getDate() + (parseInt(days) || 0));
            const yy = dt.getFullYear();
            const mm = String(dt.getMonth() + 1).padStart(2, '0');
            const dd = String(dt.getDate()).padStart(2, '0');
            return `${yy}-${mm}-${dd}`;
        }

        // ==================== QR (OFFLINE) ====================
        // QR generator minimal (tanpa library eksternal). Versi ini menampilkan QR yang valid
        // untuk kebutuhan verifikasi (scan-to-print). Dirancang ringan.
        // Catatan: implementasi menggunakan encoder sederhana berbasis error-correction level L.
        // Untuk keperluan internal, ini cukup stabil dan tidak bergantung pada akses ke provider QR.
        function renderQrToElement(elementId, text) {
            const el = document.getElementById(elementId);
            if (!el) return;

            // Pastikan container punya layout terukur
            el.style.display = 'flex';
            el.style.alignItems = 'center';
            el.style.justifyContent = 'center';

            // Ukuran mengikuti container (fallback 115). 115px lebih mudah discan saat diprint.
            const targetSize = Math.max(90, Math.min(180, (el.clientWidth || 115)));

            // PRIORITAS: pakai gambar QR resolusi tinggi + error correction H + margin (quiet zone) cukup
            // Ini jauh lebih mudah terdeteksi kamera saat discan dari kertas.
            const img = document.createElement('img');
            img.alt = 'QR';
            img.style.width = targetSize + 'px';
            img.style.height = targetSize + 'px';
            img.style.display = 'block';
            img.style.imageRendering = 'pixelated';
            img.style.setProperty('image-rendering', 'crisp-edges');
            img.draggable = false;
            img.loading = 'eager';
            img.decoding = 'async';
            img.referrerPolicy = 'no-referrer';
            img.crossOrigin = 'anonymous';
            // Gunakan resolusi kelipatan dari ukuran cetak agar tidak blur saat dicetak.
            // Prinsip: pakai faktor skala integer (misal 6x) sehingga QR tidak "blur" ketika diprint.
            // chld=H|4 => error correction tinggi + quiet zone standar (kotak QR jadi lebih besar, lebih mudah discan)
            const scaleFactor = 8;
            const hi = Math.max(320, Math.min(1200, targetSize * scaleFactor));
            img.style.imageRendering = 'pixelated';
            img.style.setProperty('image-rendering', 'crisp-edges');
            // Provider utama: QRServer (stabil) + error correction tinggi (H) + quiet zone (margin)
            img.src = `https://api.qrserver.com/v1/create-qr-code/?size=${hi}x${hi}&ecc=H&margin=4&data=${encodeURIComponent(String(text))}`;

            // Fallback 1: QuickChart (jika QRServer diblok)
            let _triedBackupProvider = false;

            // Fallback: jika provider diblok total, pakai QR offline.
            // Catatan: QR offline kita hanya EC level L, jadi jika terpaksa pakai offline maka overlay logo akan disembunyikan
            // agar QR tetap bisa terbaca.
            img.onerror = () => {
                if (!_triedBackupProvider) {
                    _triedBackupProvider = true;
                    img.src = `https://quickchart.io/qr?text=${encodeURIComponent(String(text))}&size=${hi}&ecLevel=H&margin=4`;
                    return;
                }

                try {
                    // Jika masuk mode offline, sembunyikan overlay logo (supaya QR bisa discan)
                    try {
                        const overlay = el.parentElement && el.parentElement.querySelector('[data-qr-overlay]');
                        if (overlay) overlay.style.display = 'none';
                    } catch (e) {
                        // ignore
                    }

                    const quiet = 10; // lebih besar agar lebih mudah discan
                    const qr = QRCodeMinimal.encode(text);
                    const cells = qr.modules.length;

                    const usable = targetSize - (quiet * 2);
                    const scale = Math.max(1, Math.floor(usable / cells));
                    const drawnSize = scale * cells;
                    const extra = targetSize - drawnSize;
                    const pad = Math.floor(extra / 2);

                    const canvas = document.createElement('canvas');
                    canvas.width = targetSize;
                    canvas.height = targetSize;
                    canvas.style.width = targetSize + 'px';
                    canvas.style.height = targetSize + 'px';

                    const ctx = canvas.getContext('2d');
                    ctx.imageSmoothingEnabled = false;
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, targetSize, targetSize);

                    const offset = pad;
                    ctx.fillStyle = '#000';
                    for (let r = 0; r < cells; r++) {
                        for (let c = 0; c < cells; c++) {
                            if (qr.modules[r][c]) {
                                ctx.fillRect(offset + c * scale, offset + r * scale, scale, scale);
                            }
                        }
                    }

                    el.innerHTML = '';
                    el.appendChild(canvas);
                } catch (e) {
                    console.error('GAGAL GENERATE QR:', e);
                    el.innerHTML = '';
                }
            };

            el.innerHTML = '';
            el.appendChild(img);
        }

        // QR encoder minimal (MODE BYTE, VERSION 3, EC LEVEL L) untuk teks URL pendek.
        // verifyUrl kita pendek, aman masuk kapasitas.
        const QRCodeMinimal = (() => {
            function encode(text) {
                // Version 3-L capacity (byte mode) 53 bytes.
                // Penting: JANGAN DIPOTONG, karena QR harus membuka URL verifikasi lengkap.
                const bytes = new TextEncoder().encode(String(text));
                if (bytes.length > 53) {
                    throw new Error('DATA TERLALU PANJANG UNTUK QR OFFLINE VERSION 3-L');
                }
                const data = bytes;

                // Build bit stream
                const bits = [];
                const pushBits = (val, len) => {
                    for (let i = len - 1; i >= 0; i--) bits.push((val >> i) & 1);
                };

                // Mode indicator: byte (0100)
                pushBits(0b0100, 4);
                // Character count (version 1-9 => 8 bits)
                pushBits(data.length, 8);
                // Data bytes
                for (const b of data) pushBits(b, 8);
                // Terminator
                pushBits(0, 4);

                // Pad to byte boundary
                while (bits.length % 8 !== 0) bits.push(0);

                // Convert to codewords
                const codewords = [];
                for (let i = 0; i < bits.length; i += 8) {
                    let cw = 0;
                    for (let j = 0; j < 8; j++) cw = (cw << 1) | bits[i + j];
                    codewords.push(cw);
                }

                // Version 3-L: total codewords = 70, data codewords = 55, ec codewords = 15
                while (codewords.length < 55) {
                    codewords.push(codewords.length % 2 === 0 ? 0xEC : 0x11);
                }
                codewords.length = 55;

                const ec = reedSolomonCompute(codewords, 15);
                const all = codewords.concat(ec);

                // Build matrix
                const version = 3;
                const size = 21 + (version - 1) * 4; // 29
                const m = makeMatrix(size);
                const res = makeMatrix(size, false);

                // Finder patterns + separators
                placeFinder(m, 0, 0);
                placeFinder(m, 0, size - 7);
                placeFinder(m, size - 7, 0);
                placeTiming(m);
                placeDarkModule(m, version);
                placeAlignment(m, version);

                // Reserve format info areas
                reserveFormatAreas(m);

                // Place data
                placeData(m, all);

                // Mask 0 (simple)
                applyMask(m, 0);

                // Format info for EC L + mask 0
                placeFormatInfo(m, 0);

                // Convert to boolean modules (true=black)
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        res[r][c] = m[r][c] === 1;
                    }
                }

                return { modules: res };
            }

            function makeMatrix(size, fill = null) {
                const a = new Array(size);
                for (let i = 0; i < size; i++) {
                    a[i] = new Array(size);
                    for (let j = 0; j < size; j++) a[i][j] = fill;
                }
                return a;
            }

            function placeFinder(m, r0, c0) {
                const size = m.length;
                for (let r = -1; r <= 7; r++) {
                    for (let c = -1; c <= 7; c++) {
                        const rr = r0 + r;
                        const cc = c0 + c;
                        if (rr < 0 || cc < 0 || rr >= size || cc >= size) continue;
                        const on = (r >= 0 && r <= 6 && c >= 0 && c <= 6 && (
                            r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)
                        ));
                        const sep = (r === -1 || r === 7 || c === -1 || c === 7);
                        m[rr][cc] = sep ? 0 : (on ? 1 : 0);
                    }
                }
            }

            function placeTiming(m) {
                const size = m.length;
                for (let i = 8; i < size - 8; i++) {
                    if (m[6][i] === null) m[6][i] = (i % 2 === 0) ? 1 : 0;
                    if (m[i][6] === null) m[i][6] = (i % 2 === 0) ? 1 : 0;
                }
            }

            function placeDarkModule(m, version) {
                const size = m.length;
                m[4 * version + 9][8] = 1;
            }

            function placeAlignment(m, version) {
                // Version 3 has alignment pattern at (22,22) (0-index)
                if (version < 2) return;
                const pos = 22;
                placeAlignmentPattern(m, pos - 2, pos - 2);
            }

            function placeAlignmentPattern(m, r0, c0) {
                for (let r = 0; r < 5; r++) {
                    for (let c = 0; c < 5; c++) {
                        const on = r === 0 || r === 4 || c === 0 || c === 4 || (r === 2 && c === 2);
                        m[r0 + r][c0 + c] = on ? 1 : 0;
                    }
                }
            }

            function reserveFormatAreas(m) {
                const size = m.length;
                for (let i = 0; i < 9; i++) {
                    if (m[8][i] === null) m[8][i] = 0;
                    if (m[i][8] === null) m[i][8] = 0;
                }
                for (let i = size - 8; i < size; i++) {
                    if (m[8][i] === null) m[8][i] = 0;
                    if (m[i][8] === null) m[i][8] = 0;
                }
                m[8][8] = 0;
            }

            function placeData(m, allCodewords) {
                const size = m.length;
                // Convert codewords to bit stream
                const bits = [];
                for (const cw of allCodewords) {
                    for (let i = 7; i >= 0; i--) bits.push((cw >> i) & 1);
                }

                let bitIndex = 0;
                let dir = -1;
                for (let col = size - 1; col > 0; col -= 2) {
                    if (col === 6) col--; // skip timing column
                    for (let row = (dir === -1 ? size - 1 : 0);
                         dir === -1 ? row >= 0 : row < size;
                         row += dir) {
                        for (let c = 0; c < 2; c++) {
                            const cc = col - c;
                            if (m[row][cc] !== null) continue;
                            const bit = bits[bitIndex++] || 0;
                            m[row][cc] = bit;
                        }
                    }
                    dir *= -1;
                }
            }

            function applyMask(m, mask) {
                const size = m.length;
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        // skip function patterns: we approximate by checking reserved (null means data was placed)
                        // At this stage, all cells are 0/1. We mark function patterns by simple heuristics:
                        // Do not mask finder+timing+format+alignment areas where we wrote early.
                        if (isFunctionModule(r, c, size)) continue;
                        if (mask === 0) {
                            if ((r + c) % 2 === 0) m[r][c] ^= 1;
                        }
                    }
                }
            }

            function isFunctionModule(r, c, size) {
                // finder areas
                const inFinder = (r <= 8 && c <= 8) || (r <= 8 && c >= size - 9) || (r >= size - 9 && c <= 8);
                if (inFinder) return true;
                // timing
                if (r === 6 || c === 6) return true;
                // format
                if (r === 8 || c === 8) return true;
                // alignment (version 3)
                if (r >= 20 && r <= 24 && c >= 20 && c <= 24) return true;
                // dark module
                if (r === 21 && c === 8) return true;
                return false;
            }

            function placeFormatInfo(m, mask) {
                // EC level L = 01, mask 0 = 000
                const ec = 0b01;
                const format = (ec << 3) | (mask & 0b111);
                const formatBits = formatInfoBits(format);
                const size = m.length;

                const coords1 = [
                    [8,0],[8,1],[8,2],[8,3],[8,4],[8,5],[8,7],[8,8],[7,8],[5,8],[4,8],[3,8],[2,8],[1,8],[0,8]
                ];
                for (let i = 0; i < 15; i++) {
                    const [r,c] = coords1[i];
                    m[r][c] = formatBits[i];
                }

                const coords2 = [
                    [size-1,8],[size-2,8],[size-3,8],[size-4,8],[size-5,8],[size-6,8],[size-7,8],
                    [8,size-8],[8,size-7],[8,size-6],[8,size-5],[8,size-4],[8,size-3],[8,size-2],[8,size-1]
                ];
                for (let i = 0; i < 15; i++) {
                    const [r,c] = coords2[i];
                    m[r][c] = formatBits[i];
                }
            }

            function formatInfoBits(format) {
                // BCH(15,5) with generator 0x537 and mask 0x5412
                let data = format << 10;
                const gen = 0x537;
                for (let i = 14; i >= 10; i--) {
                    if ((data >> i) & 1) data ^= gen << (i - 10);
                }
                const bch = ((format << 10) | data) ^ 0x5412;
                const bits = [];
                for (let i = 14; i >= 0; i--) bits.push((bch >> i) & 1);
                return bits;
            }

            // --- Reed-Solomon over GF(256) ---
            const GF = (() => {
                const exp = new Array(512);
                const log = new Array(256);
                let x = 1;
                for (let i = 0; i < 255; i++) {
                    exp[i] = x;
                    log[x] = i;
                    x <<= 1;
                    if (x & 0x100) x ^= 0x11d;
                }
                for (let i = 255; i < 512; i++) exp[i] = exp[i - 255];
                return { exp, log };
            })();

            function gfMul(a, b) {
                if (a === 0 || b === 0) return 0;
                return GF.exp[GF.log[a] + GF.log[b]];
            }

            function reedSolomonCompute(data, ecLen) {
                const gen = rsGenerator(ecLen);
                const res = new Array(ecLen).fill(0);
                for (const d of data) {
                    const factor = d ^ res[0];
                    res.shift();
                    res.push(0);
                    for (let i = 0; i < ecLen; i++) {
                        res[i] ^= gfMul(gen[i], factor);
                    }
                }
                return res;
            }

            function rsGenerator(ecLen) {
                let poly = [1];
                for (let i = 0; i < ecLen; i++) {
                    poly = rsPolyMul(poly, [1, GF.exp[i]]);
                }
                // remove leading 1
                poly.shift();
                return poly;
            }

            function rsPolyMul(p, q) {
                const r = new Array(p.length + q.length - 1).fill(0);
                for (let i = 0; i < p.length; i++) {
                    for (let j = 0; j < q.length; j++) {
                        r[i + j] ^= gfMul(p[i], q[j]);
                    }
                }
                return r;
            }

            return { encode };
        })();

        // ==================== API FUNCTIONS ====================
        async function apiCall(action, data = {}) {
            try {
                // Pakai Content-Type text/plain agar tidak kena preflight CORS dan tetap bisa baca respon JSON
                const response = await fetch(CONFIG.GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action, ...data })
                });

                const text = await response.text();
                try {
                    return JSON.parse(text);
                } catch (e) {
                    // fallback jika respon bukan JSON
                    return { success: true };
                }
            } catch (error) {
                console.error('API Error:', error);
                return { success: false, error: error.message };
            }
        }

        async function apiGet(action, params = {}) {
            try {
                const url = new URL(CONFIG.GOOGLE_SCRIPT_URL);
                url.searchParams.append('action', action);
                Object.keys(params).forEach(key => url.searchParams.append(key, params[key]));
                
                const response = await fetch(url.toString());
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return { success: false, error: error.message };
            }
        }

            }

        async function submitLeaveRequest() {
            state.loading = true;
            render();

            const data = {
                employeeId: state.selectedEmployee.id,
                employeeName: state.selectedEmployee.name,
                ...state.formData,
                supervisorPhone: state.selectedEmployee.supervisorPhone || '',
                photo: state.photoPreview || '',
                tanggalPengajuan: new Date().toISOString()
            };

            try {
                // CEK: apakah sudah ada pengajuan hari ini (WIB)
                const todayInfo = await apiGet('getTodaySubmission', { employeeId: String(state.selectedEmployee.id || '').trim() });
                if (todayInfo && todayInfo.success && todayInfo.data && todayInfo.data.exists) {
                    const st = String(todayInfo.data.status || '').toUpperCase();
                    if (st && st !== 'MENUNGGU') {
                        state.loading = false;
                        render();
                        alert('ANDA SUDAH MEMBUAT PENGAJUAN HARI INI DAN SUDAH DIPROSES. SILAKAN AJUKAN KEMBALI BESOK.');
                        return;
                    }
                    // Jika MENUNGGU: lanjut upsert (update yang lama jadi data terbaru)
                }

                // UPSERT: jika karyawan submit di tanggal yang sama, data akan di-update (bukan tambah baris baru)
                const res = await apiCall('upsertLeaveToday', data);
                if (res && res.success === false) {
                    state.loading = false;
                    render();
                    alert(res.error || 'GAGAL MENGIRIM PENGAJUAN!');
                    return;
                }

                const durKerja = calculateDurationWorkdays(data.tanggalMulai, data.tanggalSelesai);
                state.submittedData = {
                    ...data,
                    terpakai: durKerja,
                    sisa: state.selectedEmployee.remainingLeave - (data.jenisCuti === 'CUTI TAHUNAN' ? durKerja : 0)
                };

                // SEKALI PAKAI: setelah submit berhasil, batas maksimal kembali ke 2 hari
                try {
                    const idx = state.employees.findIndex(e => String(e.id).toUpperCase() === String(state.selectedEmployee.id).toUpperCase());
                    if (idx >= 0) state.employees[idx].maxLeaveRequestDays = 2;
                    state.selectedEmployee.maxLeaveRequestDays = 2;
                } catch (e) {
                    // ignore
                }

                state.page = 'result';
            } catch (error) {
                alert('GAGAL MENGIRIM PENGAJUAN!');
            }
            
            state.loading = false;
            render();
        }

        async function handleApproval(request, status) {
            if (!confirm(`YAKIN INGIN ${status === 'DISETUJUI' ? 'MENYETUJUI' : 'MENOLAK'} PENGAJUAN INI?`)) return;
            
            state.loading = true;
            render();

            try {
                const updated = await apiCall('updateLeaveStatus', {
                    requestId: request.rowIndex,
                    status: status,
                    adminName: state.adminUsername,
                    processedDate: new Date().toISOString()
                });
                if (!updated || updated.success === false) {
                    alert((updated && updated.error) ? updated.error : 'GAGAL MENGUPDATE STATUS!');
                    state.loading = false;
                    render();
                    return;
                }
                
                await new Promise(resolve => setTimeout(resolve, 2000));
                await loadLeaveRequests();
                await loadEmployees();
            } catch (error) {
                alert('GAGAL MENGUPDATE STATUS!');
            }
            
            state.loading = false;
            render();
        }

        async function checkStatus() {
            if (!state.statusCheckId || !String(state.statusCheckId).trim()) {
                alert('PILIH NAMA KARYAWAN TERLEBIH DAHULU!');
                return;
            }
            
            state.loading = true;
            render();

            try {
                const result = await apiGet('checkStatus', { employeeId: String(state.statusCheckId).trim().toUpperCase() });
                state.statusCheckResult = result.success ? result.data : null;
                if (!result.success) {
                    alert('DATA TIDAK DITEMUKAN!');
                }
            } catch (error) {
                alert('GAGAL MENGECEK STATUS!');
            }
            
            state.loading = false;
            render();
        }

        // ==================== RENDER FUNCTIONS ====================
        function render() {
            const app = document.getElementById('app');

            // Pastikan mode preview print tidak terbawa ke halaman lain
            document.body.classList.remove('print-preview');
            
            if (!state.settings.websiteActive && !state.isAdminLoggedIn) {
                app.innerHTML = renderMaintenancePage();
                return;
            }

            // Check for print action in URL
            const urlParams = new URLSearchParams(window.location.search);

            // SHORT LINK QR: ?p=ROWINDEX (agar QR offline muat & stabil)
            if (urlParams.get('p')) {
                renderPrintPage(urlParams.get('p'));
                return;
            }

            if (urlParams.get('action') === 'print') {
                renderPrintPage(urlParams.get('id'));
                return;
            }

            let content = '';
            switch (state.page) {
                case 'select':
                    content = renderSelectPage();
                    break;
                case 'form':
                    content = renderFormPage();
                    break;
                case 'result':
                    content = renderResultPage();
                    break;
                case 'admin':
                    content = renderAdminPage();
                    break;
            }
            
            app.innerHTML = content;
            
            // Render modals
            if (state.showAdminLogin) app.innerHTML += renderAdminLoginModal();
            if (state.showSettings) app.innerHTML += renderSettingsModal();
            if (state.showChangePassword) app.innerHTML += renderChangePasswordModal();
            if (state.showEmployeeForm) app.innerHTML += renderEmployeeModal();
            if (state.showWhatsAppSettings) app.innerHTML += renderWhatsAppModal();
            if (state.showKopSettings) app.innerHTML += renderKopModal();
            if (state.showMaintenanceSettings) app.innerHTML += renderMaintenanceModal();
            if (state.showStatusCheck) app.innerHTML += renderStatusCheckModal();

            attachEventListeners();

        }

        function renderFormPage() {

            const showFotoUpload = state.formData.jenisCuti === 'CUTI SAKIT';

            // Durasi untuk tampilan: hitung hari kerja (tanpa Sabtu/Minggu)

        function applyPrintPreviewScale() {
            const viewport = document.getElementById('printViewport');
            const area = document.getElementById('printArea');
            if (!viewport || !area) return;

            // Aktifkan mode softcopy
            document.body.classList.add('print-preview');

            // Ukur ukuran asli (tanpa terpengaruh transform)
            const baseWidth = area.offsetWidth || 794;
            const baseHeight = area.offsetHeight || 1123;

            const padding = 24; // ruang kiri-kanan
            const vw = Math.max(320, window.innerWidth || 360);
            const scale = Math.min(1, (vw - padding) / baseWidth);

            area.style.transformOrigin = 'top center';
            area.style.transform = `scale(${scale})`;

            // Viewport wrapper
            viewport.style.display = 'flex';
            viewport.style.justifyContent = 'center';
            viewport.style.padding = '12px';
            viewport.style.overflowX = 'hidden';

            // Tinggi wrapper menyesuaikan hasil scale (agar tidak terpotong)
            viewport.style.minHeight = Math.ceil((baseHeight * scale) + 24) + 'px';
        }

            // 2) window.location.origin + window.location.pathname
            // Catatan: jika dibuka via file://, window.location.origin bisa "null" -> WAJIB isi PUBLIC_BASE_URL.
            const defaultBase = (window.location.origin && window.location.origin !== 'null')
                ? (window.location.origin + window.location.pathname)
                : (window.location.href.split('?')[0].split('#')[0]);

        // ==================== EVENT HANDLERS ====================
        function attachEventListeners() {
            // Login form
            const loginForm = document.getElementById('loginForm');
            if (loginForm) {
                // Fix HP: saat fokus input, scroll modal agar tidak ketutup keyboard
                const pwd = document.getElementById('loginPassword');
                if (pwd) {
                    const scrollInto = () => {
                        // timeout kecil agar keyboard sempat muncul
                        setTimeout(() => {
                            try {
                                pwd.scrollIntoView({ behavior: 'smooth', block: 'center' });
                            } catch (e) {
                                // fallback
                                pwd.scrollIntoView(true);
                            }
                        }, 250);
                    };
                    pwd.addEventListener('focus', scrollInto);
                    pwd.addEventListener('click', scrollInto);
                }

                loginForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const password = document.getElementById('loginPassword').value;
                    const role = state.userRole || 'admin';
                    const username = role === 'manager' ? 'manager' : 'admin';

                    document.getElementById('loginBtn').textContent = 'MEMVERIFIKASI...';
                    
                    try {
                        const result = await apiGet('verifyAdmin', { username, password });
                        if (result.success) {
                            state.isAdminLoggedIn = true;
                            state.adminUsername = username;
                            state.showAdminLogin = false;
                            state.page = 'admin';
                            await loadLeaveRequests();
                            startAutoRefresh();
                        } else {
                            alert('PASSWORD SALAH!');
                        }
                    } catch (error) {
                        alert('GAGAL LOGIN!');
                    }
                    render();
                };
            }

            // Leave form
            const leaveForm = document.getElementById('leaveForm');
            if (leaveForm) {
                leaveForm.onsubmit = (e) => {
                    e.preventDefault();
                    if (validateForm()) {
                        submitLeaveRequest();
                    }
                };
            }

            // Change password form
            const changePasswordForm = document.getElementById('changePasswordForm');
            if (changePasswordForm) {
                changePasswordForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const oldPwd = document.getElementById('oldPassword').value;
                    const newPwd = document.getElementById('newPassword').value;
                    const confirmPwd = document.getElementById('confirmPassword').value;

                    const isManager = (state.adminUsername || 'admin') === 'manager';
                    const action = isManager ? 'changePasswordManager' : 'changePasswordAdmin';
                    
                    if (newPwd.length < 6) {
                        alert('PASSWORD BARU MINIMAL 6 KARAKTER!');
                        return;
                    }
                    if (newPwd !== confirmPwd) {
                        alert('KONFIRMASI PASSWORD TIDAK COCOK!');
                        return;
                    }
                    
                    try {
                        const result = await apiCall(action, { oldPassword: oldPwd, newPassword: newPwd });
                        if (!result || result.success === false) {
                            alert((result && result.error) ? result.error : 'GAGAL MENGUBAH PASSWORD!');
                            return;
                        }
                        alert('PASSWORD BERHASIL DIUBAH!');
                        closeChangePassword();
                    } catch (error) {
                        alert('GAGAL MENGUBAH PASSWORD!');
                    }
                };
            }

            // WhatsApp form
            const waForm = document.getElementById('waForm');
            if (waForm) {
                waForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const wa = document.getElementById('adminWa').value;
                    const pwd = document.getElementById('waPassword').value;
                    
                    try {
                        const currentUser = (state.adminUsername || 'admin');
                        const verify = await apiGet('verifyAdmin', { username: currentUser, password: pwd });
                        if (!verify.success) {
                            alert('PASSWORD SALAH!');
                            return;
                        }
                        
                        const saved = await apiCall('updateSettings', { adminWa: wa });
                        if (!saved || saved.success === false) {
                            alert((saved && saved.error) ? saved.error : 'GAGAL MENYIMPAN!');
                            return;
                        }
                        state.settings.adminWa = wa;
                        alert('NOMOR WHATSAPP BERHASIL DIUBAH!');
                        closeWhatsAppSettings();
                    } catch (error) {
                        alert('GAGAL MENYIMPAN!');
                    }
                };
            }

            // Kop form
            const kopForm = document.getElementById('kopForm');
            if (kopForm) {
                kopForm.onsubmit = async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('kopName').value;
                    const nip = document.getElementById('kopNip').value;
                    const pwd = document.getElementById('kopPassword').value;
                    
                    try {
                        const currentUser = (state.adminUsername || 'admin');
                        const verify = await apiGet('verifyAdmin', { username: currentUser, password: pwd });
                        if (!verify.success) {
                            alert('PASSWORD SALAH!');
                            return;
                        }
                        
                        const saved = await apiCall('updateSettings', { kopMengetahuiName: name, kopMengetahuiNip: nip });
                        if (!saved || saved.success === false) {
                            alert((saved && saved.error) ? saved.error : 'GAGAL MENYIMPAN!');
                            return;
                        }
                        state.settings.kopMengetahuiName = name;
                        state.settings.kopMengetahuiNip = nip;
                        alert('DATA KOP SURAT BERHASIL DIUBAH!');
                        closeKopSettings();
                    } catch (error) {
                        alert('GAGAL MENYIMPAN!');
                    }

            const statusSearch = document.getElementById('statusEmployeeSearch');
            if (statusSearch) {
                const scrollInto = () => {
                    setTimeout(() => {
                        try {
                            statusSearch.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        } catch (e) {
                            statusSearch.scrollIntoView(true);
                        }
                    }, 250);
                };
                statusSearch.addEventListener('focus', scrollInto);
                statusSearch.addEventListener('click', scrollInto);
            }

        function validateForm() {
            const required = ['jabatan', 'unitKerja', 'jenisCuti', 'alasan', 'lamaCuti', 'tanggalMulai', 'alamat', 'telepon', 'email', 'petugasPengganti'];
            
            for (const field of required) {
                if (!state.formData[field]) {
                    alert(`HARAP ISI SEMUA FIELD YANG WAJIB!`);
                    return false;
                }
            }

            if (state.formData.jabatan === 'ANGGOTA' && !state.formData.persetujuanPengawas) {
                alert('HARAP ISI PERSETUJUAN PENGAWAS!');
                return false;
            }

            if (state.formData.jenisCuti === 'CUTI SAKIT' && !state.photoPreview) {
                alert('HARAP UPLOAD LAMPIRAN SURAT DOKTER!');
                return false;
            }

            const duration = calculateDurationWorkdays(state.formData.tanggalMulai, state.formData.tanggalSelesai);

            // Validasi maksimal lama pengajuan per karyawan (hari kerja)
            const maxDays = Math.min(12, Math.max(1, parseInt(state.selectedEmployee?.maxLeaveRequestDays ?? 2)));
            if (duration > maxDays) {
                alert(`MAKSIMAL LAMA PENGAJUAN UNTUK ANDA ADALAH ${maxDays} HARI!`);
                return false;
            }

            // Validasi sisa cuti tahunan berdasarkan hari kerja
            if (state.formData.jenisCuti === 'CUTI TAHUNAN' && duration > state.selectedEmployee.remainingLeave) {
                alert('SISA CUTI TIDAK MENCUKUPI!');
                return false;
            }

            return true;
        }

        window.handleSaveEmployee = async function() {
            const wasEditing = !!state.editingEmployee;
            const empId = document.getElementById('empId')?.value?.toUpperCase();
            const empName = document.getElementById('empName')?.value?.toUpperCase();
            const empUsedLeave = parseInt(document.getElementById('empUsedLeave')?.value);
            const empSupervisorName = document.getElementById('empSupervisorName')?.value?.toUpperCase();
            const empSupervisor = document.getElementById('empSupervisor')?.value;

            const empMaxLeaveDays = parseInt(document.getElementById('empMaxLeaveDays')?.value);
            if (isNaN(empMaxLeaveDays) || empMaxLeaveDays < 1 || empMaxLeaveDays > 12) {
                alert('MAKSIMAL LAMA PENGAJUAN CUTI HARUS ANTARA 1-12 HARI!');
                return;
            }

            if (!empId || !empName) {
                alert('ID DAN NAMA KARYAWAN WAJIB DIISI!');
                return;
            }

            if (isNaN(empUsedLeave) || empUsedLeave < 0 || empUsedLeave > 12) {
                alert('CUTI TERPAKAI HARUS ANTARA 0-12 HARI!');
                return;
            }

            const remainingLeave = 12 - empUsedLeave;

            const empSupervisorSalutation = document.getElementById('empSupervisorSalutation')?.value;

            const employeeData = {
                id: state.editingEmployee ? state.editingEmployee.id : empId,
                name: empName,
                remainingLeave: remainingLeave,
                usedLeave: empUsedLeave,
                supervisorName: empSupervisorName,
                supervisorPhone: empSupervisor,
                // opsional: bisa diisi dari Google Sheet langsung
                supervisorSalutation: empSupervisorSalutation ? empSupervisorSalutation.toUpperCase() : '',
                // baru: maks pengajuan cuti per karyawan
                maxLeaveRequestDays: empMaxLeaveDays
            };

            try {
                let saved;
                if (state.editingEmployee) {
                    saved = await apiCall('updateEmployee', employeeData);
                } else {
                    saved = await apiCall('addEmployee', employeeData);
                }
                if (!saved || saved.success === false) {
                    alert((saved && saved.error) ? saved.error : 'GAGAL MENYIMPAN KARYAWAN!');
                    return;
                }
                
                await new Promise(resolve => setTimeout(resolve, 2000));
                await loadEmployees();
                
                state.editingEmployee = null;
                state.employeeFormData = { id: '', name: '', usedLeave: 0, supervisorName: '', supervisorSalutation: '', supervisorPhone: '', maxLeaveRequestDays: 2 };
                render();
                alert(wasEditing ? 'KARYAWAN BERHASIL DIUPDATE!' : 'KARYAWAN BERHASIL DITAMBAHKAN!');
            } catch (error) {
                alert('GAGAL MENYIMPAN KARYAWAN!');
            }
        };

        window.handleDeleteEmployee = async function(id) {
            if (!confirm('YAKIN INGIN MENGHAPUS KARYAWAN INI?')) return;
            
            try {
                const del = await apiCall('deleteEmployee', { id });
                if (!del || del.success === false) {
                    alert((del && del.error) ? del.error : 'GAGAL MENGHAPUS KARYAWAN!');
                    return;
                }
                await new Promise(resolve => setTimeout(resolve, 2000));
                await loadEmployees();
                render();
            } catch (error) {
                alert('GAGAL MENGHAPUS KARYAWAN!');
            }
        };

        window.updateFilterDate = function(value) {
            state.adminFilterDate = value;
            render();
        };

        window.resetFilter = function() {
            state.adminFilterDate = '';
            render();
        };

        window.logout = function() {
            state.isAdminLoggedIn = false;
            state.adminUsername = 'admin';
            state.userRole = 'admin';
            state.page = 'select';
            stopAutoRefresh();
            render();
        };

        window.togglePasswordVisibility = function(inputId) {
            const input = document.getElementById(inputId);
            if (input) {
                input.type = input.type === 'password' ? 'text' : 'password';
            }
        };

        window.printRequest = function(rowIndex) {
            let baseUrl = (CONFIG.PUBLIC_BASE_URL && String(CONFIG.PUBLIC_BASE_URL).trim())
                ? String(CONFIG.PUBLIC_BASE_URL).trim().split('?')[0].split('#')[0]
                : (window.location.origin && window.location.origin !== 'null')
                    ? (window.location.origin + window.location.pathname)
                    : window.location.href.split('?')[0].split('#')[0];

            baseUrl = baseUrl.replace(/\/+$/, '/');

            // Konsisten dengan QR: pakai shortlink
            // ui=1 agar tombol PRINT/KEMBALI muncul (khusus admin)
            window.open(`${baseUrl}?p=${rowIndex}&ui=1`, '_blank');
        };

        window.handleApproval = handleApproval;
        window.checkStatus = checkStatus;

        // Auto-refresh functions
        function startAutoRefresh() {
            if (state.autoRefreshInterval) return;
            state.autoRefreshInterval = setInterval(async () => {
                if (!state.isModalOpen && state.page === 'admin') {
                    await loadLeaveRequests();
                }
            }, 5000);
        }

        function stopAutoRefresh() {
            if (state.autoRefreshInterval) {
                clearInterval(state.autoRefreshInterval);
                state.autoRefreshInterval = null;
            }
        }

        function pauseAutoRefresh() {
            state.isModalOpen = true;
        }

        function resumeAutoRefresh() {
            state.isModalOpen = false;
        }

        // Time update (TANPA RENDER ULANG - AGAR INPUT MODAL TIDAK KE-RESET)
        setInterval(() => {
            state.currentTime = new Date();

            const clockEls = document.querySelectorAll('[data-clock]');
            const dateEls = document.querySelectorAll('[data-date]');

            const clockText = formatTime(state.currentTime);
            const dateText = formatDate(state.currentTime);

            clockEls.forEach(el => (el.textContent = clockText));
            dateEls.forEach(el => (el.textContent = dateText));
        }, 1000);

        // Initialize
        async function init() {
            await loadSettings();
            await loadEmployees();
            render();
        }

        init();
    </script>
</body>
</html>
